name: Selective Build and Analyze with SonarQube (Windows only, fully PowerShell)

on:
  push:
    branches:
      - 'feature/**'
      - 'develop*'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  selective-analysis:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Maven 3.6.2 manually
        run: |
          $ErrorActionPreference = "Stop"
          $mavenUrl = "https://archive.apache.org/dist/maven/maven-3/3.6.2/binaries/apache-maven-3.6.2-bin.zip"
          $zipPath = "$env:RUNNER_TEMP\\maven.zip"
          $mavenDir = "$env:RUNNER_TEMP\\maven"
          Invoke-WebRequest -Uri $mavenUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $mavenDir
          $mavenBin = "$mavenDir\\apache-maven-3.6.2\\bin"
          Add-Content -Path $env:GITHUB_PATH -Value $mavenBin
          Add-Content -Path $env:GITHUB_ENV -Value "MAVEN_HOME=$mavenBin"

      - name: Confirm Maven version
        run: mvn -v

      - name: Detect changed modules
        id: detect
        run: |
          git fetch origin $env:GITHUB_EVENT_BEFORE
          Write-Host "🔍 Comparing $env:GITHUB_EVENT_BEFORE → $env:GITHUB_SHA"
          $changed = git diff --name-only $env:GITHUB_EVENT_BEFORE $env:GITHUB_SHA |
                     ForEach-Object { ($_ -split '/')[0] } |
                     Sort-Object -Unique
          Write-Host "🔍 Changed dirs (raw): $changed"
          $includes = @()
          foreach ($dir in $changed) {
            if ($dir -in @("simple-maven-project", "A-project", "B-project")) {
              Write-Host "✅ $dir is a recognized module"
              $includes += $dir
            }
          }
          $modules = $includes -join ' '
          Write-Host "📦 Final MODULES: $modules"
          Set-Content -Path $env:GITHUB_OUTPUT -Value "modules=$modules"

      - name: Set SONAR_PROJECT_KEY from repo and branch
        run: |
          $branch = "${{ github.head_ref || github.ref_name }}"
          $repo = "${{ github.repository }}"
          $repoName = $repo.Split('/')[1]
          $normalizedBranch = $branch -replace '[^a-zA-Z0-9._-]', '-'
          $sonarKey = "$repoName-$normalizedBranch"
          Write-Host "🔑 Sonar project key: $sonarKey"
          Add-Content -Path $env:GITHUB_ENV -Value "SONAR_PROJECT_KEY=$sonarKey"
          Add-Content -Path $env:GITHUB_ENV -Value "SONAR_PROJECT_NAME=$sonarKey"

      - name: Build & Analyze only changed modules
        if: steps.detect.outputs.modules != ''
        run: |
          $modules = "${{ steps.detect.outputs.modules }}".Split(' ')
          foreach ($module in $modules) {
            Write-Host "=============================="
            Write-Host "🔨 Building module: $module"
            Write-Host "=============================="
            mvn -f "$module\\pom.xml" clean install -DskipTests

            Write-Host "=============================="
            Write-Host "📊 Sonar analyzing module: $module"
            Write-Host "=============================="
            mvn -f "$module\\pom.xml" sonar:sonar `
              -Dsonar.projectKey=$env:SONAR_PROJECT_KEY `
              -Dsonar.projectName=$env:SONAR_PROJECT_NAME `
              -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} `
              -Dsonar.login=${{ secrets.SONAR_TOKEN }}
          }
