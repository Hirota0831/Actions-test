name: Selective Build and Analyze with SonarQube (Windows + PR comment)

on:
  push:
    branches:
      - 'feature/**'
      - 'develop*'
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  selective-analysis:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Maven 3.6.2 manually
        run: |
          $mavenUrl = "https://archive.apache.org/dist/maven/maven-3/3.6.2/binaries/apache-maven-3.6.2-bin.zip"
          $zipPath = "$env:RUNNER_TEMP\\maven.zip"
          $mavenDir = "$env:RUNNER_TEMP\\maven"
          Invoke-WebRequest -Uri $mavenUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $mavenDir
          $mavenBin = "$mavenDir\\apache-maven-3.6.2\\bin"
          Add-Content -Path $env:GITHUB_PATH -Value $mavenBin
          Add-Content -Path $env:GITHUB_ENV -Value "MAVEN_HOME=$mavenBin"

      - name: Detect changed modules
        id: detect
        run: |
          git fetch origin ${{ github.event.before }} ${{ github.sha }}
          $changed = git diff --name-only ${{ github.event.before }} ${{ github.sha }} |
            ForEach-Object { ($_ -split '/')[0] } |
            Sort-Object -Unique
          $includes = @()
          foreach ($dir in $changed) {
            if ($dir -in @("simple-maven-project", "A-project", "B-project")) {
              $includes += $dir
            }
          }
          $modules = $includes -join ' '
          "modules=$modules" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Set SONAR_PROJECT_KEY
        run: |
          $branch = "${{ github.head_ref || github.ref_name }}"
          $repo = "${{ github.repository }}"
          $repoName = $repo.Split('/')[1]
          $normalizedBranch = $branch -replace '[^a-zA-Z0-9._-]', '-'
          $sonarKey = "$repoName-$normalizedBranch"
          Add-Content -Path $env:GITHUB_ENV -Value "SONAR_PROJECT_KEY=$sonarKey"
          Add-Content -Path $env:GITHUB_ENV -Value "SONAR_PROJECT_NAME=$sonarKey"

      - name: Build & Analyze only changed modules
        if: steps.detect.outputs.modules != ''
        run: |
          $modules = "${{ steps.detect.outputs.modules }}".Split(' ')
          foreach ($module in $modules) {
            mvn -f "$module\\pom.xml" clean install -DskipTests
            mvn -f "$module\\pom.xml" sonar:sonar `
              "-Dsonar.projectKey=$env:SONAR_PROJECT_KEY" `
              "-Dsonar.projectName=$env:SONAR_PROJECT_NAME" `
              "-Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}" `
              "-Dsonar.login=${{ secrets.SONAR_TOKEN }}"
          }

      - name: Post or update SonarQube result comment with summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const repo = context.repo.repo;
            const owner = context.repo.owner;
            const branch = context.payload.pull_request.head.ref.replace(/[^a-zA-Z0-9._-]/g, '-');
            const sonarProject = `${repo}-${branch}`;
            const sonarHost = `${{ secrets.SONAR_HOST_URL }}`;
            const sonarToken = `${{ secrets.SONAR_TOKEN }}`;
            const sonarUrl = `${sonarHost}/dashboard?id=${sonarProject}`;
            const tag = '<!-- sonar-comment -->';
            const apiUrl = `${sonarHost}/api/measures/component?component=${sonarProject}&metricKeys=bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density`;

            let summaryText = '';
            try {
              const res = await fetch(apiUrl, {
                headers: {
                  Authorization: `Basic ${Buffer.from(sonarToken + ':').toString('base64')}`
                }
              });
              const data = await res.json();
              const measures = data.component.measures;
              const lookup = Object.fromEntries(measures.map(m => [m.metric, m.value]));
              summaryText = `
                🔍 **SonarQube Analysis Completed**
              - 🐞 Bugs: ${lookup.bugs ?? 'N/A'}
              - 🛡️ Vulnerabilities: ${lookup.vulnerabilities ?? 'N/A'}
              - 🧹 Code Smells: ${lookup.code_smells ?? 'N/A'}
              - 📊 Coverage: ${lookup.coverage ?? 'N/A'}%
              - ♻️ Duplication: ${lookup.duplicated_lines_density ?? 'N/A'}%
                
                🔗 [View analysis results](${sonarUrl})`;
                } catch (e) {
                summaryText = `🔍 **SonarQube Analysis Completed**\n\n🔗 [View results](${sonarUrl})\n⚠️ Summary fetch failed`;
                }
                
                const comments = await github.rest.issues.listComments({
                owner,
                repo,
              issue_number: prNumber
              });
                
                const existing = comments.data.find(c => c.body.includes(tag));
                const body = `${tag}\n${summaryText}`;
                
                if (existing) {
                await github.rest.issues.updateComment({
                owner,
                repo,
              comment_id: existing.id,
                body
              });
              } else {
                await github.rest.issues.createComment({
                owner,
                repo,
              issue_number: prNumber,
                body
              });
              }
