name: Selective Build and Analyze with SonarQube (Windows)

on:
  push:
    branches:
      - 'feature/**'
      - 'develop*'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  selective-analysis:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    env:
      MAVEN_VERSION: 3.6.2

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Confirm Maven version
        run: |
          mvn -v
          Write-Host "Using Maven version: $env:MAVEN_VERSION"

      - name: Detect changed modules
        id: detect
        run: |
          git fetch origin $env:GITHUB_EVENT_BEFORE
          Write-Host "🔍 Comparing $env:GITHUB_EVENT_BEFORE → $env:GITHUB_SHA"
          $changed = git diff --name-only $env:GITHUB_EVENT_BEFORE $env:GITHUB_SHA |
                     ForEach-Object { ($_ -split '/')[0] } |
                     Sort-Object -Unique
          Write-Host "🔍 Changed dirs (raw): $changed"
          $includes = @()
          foreach ($dir in $changed) {
            if ($dir -in @("simple-maven-project", "A-project", "B-project")) {
              Write-Host "✅ $dir is a recognized module"
              $includes += $dir
            }
          }
          $modules = $includes -join ' '
          "modules=$modules" >> $env:GITHUB_OUTPUT
          Write-Host "📦 Final MODULES: $modules"

      - name: Set SONAR_PROJECT_KEY from repo and branch
        run: |
          $branch = "${{ github.head_ref || github.ref_name }}"
          $repo = "${{ github.repository }}"
          $repoName = $repo.Split('/')[-1]
          $normalizedBranch = $branch -replace '[^a-zA-Z0-9._-]', '-'
          $sonarKey = "$repoName-$normalizedBranch"
          "SONAR_PROJECT_KEY=$sonarKey" >> $env:GITHUB_ENV
          "SONAR_PROJECT_NAME=$sonarKey" >> $env:GITHUB_ENV
          Write-Host "🔑 Sonar project key: $sonarKey"

      - name: Build & Analyze only changed modules
        if: steps.detect.outputs.modules -ne ''
        run: |
          $modules = "${{ steps.detect.outputs.modules }}".Split(' ')
          foreach ($module in $modules) {
            Write-Host "=============================="
            Write-Host "🔨 Building module: $module"
            Write-Host "=============================="
            mvn -f "$module/pom.xml" clean install -DskipTests

            Write-Host "=============================="
            Write-Host "📊 Sonar analyzing module: $module"
            Write-Host "=============================="
            mvn -f "$module/pom.xml" sonar:sonar `
              -Dsonar.projectKey=$env:SONAR_PROJECT_KEY `
              -Dsonar.projectName=$env:SONAR_PROJECT_NAME `
              -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} `
              -Dsonar.login=${{ secrets.SONAR_TOKEN }}
          }
