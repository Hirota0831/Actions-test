name: Build and Analyze with SonarQube

on:
  push:
    branches:
      - 'feature/**'
      - 'develop*'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    env:
      SONAR_PROJECT_KEY: your-project-key
      SONAR_PROJECT_NAME: SAMPLE_PROJECT

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Maven 3.6.2
        run: |
          MAVEN_VERSION=3.6.2
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz -o maven.tar.gz
          tar -xzf maven.tar.gz
          sudo mv apache-maven-${MAVEN_VERSION} /opt/maven
          echo "/opt/maven/bin" >> $GITHUB_PATH
          echo "MAVEN_HOME=/opt/maven" >> $GITHUB_ENV

      - name: Set SONAR_PROJECT_KEY from repo and branch
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          REPO="${{ github.repository }}"
          REPO_NAME="${REPO##*/}"
          NORMALIZED_BRANCH=$(echo "$BRANCH" | sed 's#[^a-zA-Z0-9._-]#-#g')
          SONAR_KEY="${REPO_NAME}-${NORMALIZED_BRANCH}"
          echo "SONAR_PROJECT_KEY=$SONAR_KEY" >> $GITHUB_ENV
          echo "SONAR_PROJECT_NAME=$SONAR_KEY" >> $GITHUB_ENV

      - name: Confirm Maven Version
        run: mvn -version

      - name: Create project in SonarQube (if not exists)
        run: |
          curl -s -o response.txt -w "%{http_code}" \
            -u ${{ secrets.SONAR_TOKEN }}: \
            -X POST "${{ secrets.SONAR_HOST_URL }}/api/projects/create" \
            -d "project=${SONAR_PROJECT_KEY}&name=${SONAR_PROJECT_NAME}" \
            | tee status.txt

          if grep -q "400" status.txt; then
            echo "Project may already exist or bad request. Continuing..."
          fi