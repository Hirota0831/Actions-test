name: Selective Build and Analyze with SonarQube (Linux + PR comment)

on:
  push:
    branches:
      - 'feature/**'
      - 'develop*'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  selective-analysis:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Maven 3.6.2
        run: |
          MAVEN_VERSION=3.6.2
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz -o maven.tar.gz
          tar -xzf maven.tar.gz
          sudo mv apache-maven-${MAVEN_VERSION} /opt/maven
          echo "/opt/maven/bin" >> $GITHUB_PATH
          echo "MAVEN_HOME=/opt/maven" >> $GITHUB_ENV

      - name: Confirm Maven version
        run: mvn -v

      - name: Detect changed modules
        id: detect
        run: |
          git fetch origin ${{ github.event.before }} ${{ github.sha }}
          echo "🔍 Comparing ${{ github.event.before }} → ${{ github.sha }}"
          changed=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | cut -d/ -f1 | sort -u)
          echo "🔍 Changed dirs (raw): $changed"
          includes=""
          for dir in $changed; do
            if [[ "$dir" == "simple-maven-project" || "$dir" == "A-project" || "$dir" == "B-project" ]]; then
              echo "✅ $dir is a recognized module"
              includes="$includes $dir"
            fi
          done
          includes=$(echo "$includes" | xargs)
          echo "modules=$includes" >> $GITHUB_OUTPUT
          echo "📦 Final MODULES: $includes"

      - name: Set SONAR_PROJECT_KEY from repo and branch
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          REPO="${{ github.repository }}"
          REPO_NAME="${REPO##*/}"
          NORMALIZED_BRANCH=$(echo "$BRANCH" | sed 's#[^a-zA-Z0-9._-]#-#g')
          SONAR_KEY="${REPO_NAME}-${NORMALIZED_BRANCH}"
          echo "SONAR_PROJECT_KEY=$SONAR_KEY" >> $GITHUB_ENV
          echo "SONAR_PROJECT_NAME=$SONAR_KEY" >> $GITHUB_ENV
          echo "🔑 Sonar project key: $SONAR_KEY"

      - name: Build & Analyze only changed modules
        if: steps.detect.outputs.modules != ''
        run: |
          for module in ${{ steps.detect.outputs.modules }}; do
            echo "=============================="
            echo "🔨 Building module: $module"
            echo "=============================="
            mvn -f $module/pom.xml clean install -DskipTests

            echo "=============================="
            echo "📊 Sonar analyzing module: $module"
            echo "=============================="
            mvn -f $module/pom.xml sonar:sonar \
              "-Dsonar.projectKey=$SONAR_PROJECT_KEY" \
              "-Dsonar.projectName=$SONAR_PROJECT_NAME" \
              "-Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}" \
              "-Dsonar.login=${{ secrets.SONAR_TOKEN }}"
          done

      - name: Post SonarQube result to PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const repo = context.repo.repo;
            const branch = context.payload.pull_request.head.ref.replace(/[^a-zA-Z0-9._-]/g, '-');
            const sonarUrl = `${{ secrets.SONAR_HOST_URL }}/dashboard?id=${repo}-${branch}`;

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: prNumber,
              body: `🔍 **SonarQube Analysis Completed**\n\n🔗 [View analysis results](${sonarUrl})`
            });
