name: Selective Build and Analyze with SonarQube (Linux + PR comment)

on:
  push:
    branches:
      - 'feature/**'
      - 'develop*'
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  selective-analysis:
    runs-on: self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Maven 3.6.2
        run: |
          MAVEN_VERSION=3.6.2
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz -o maven.tar.gz
          tar -xzf maven.tar.gz
          sudo mv apache-maven-${MAVEN_VERSION} /opt/maven
          echo "/opt/maven/bin" >> $GITHUB_PATH
          echo "MAVEN_HOME=/opt/maven" >> $GITHUB_ENV

      - name: Detect changed modules
        id: detect
        run: |
          git fetch origin ${{ github.event.before }}
          echo "🔍 Comparing ${{ github.event.before }} → ${{ github.sha }}"
          changed=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | cut -d/ -f1 | sort -u)
          echo "🔍 Changed dirs (raw): $changed"
          includes=""
          for dir in $changed; do
            if [[ "$dir" == "simple-maven-project" || "$dir" == "A-project" || "$dir" == "B-project" ]]; then
              echo "✅ $dir is a recognized module"
              includes+="$dir "
            fi
          done
          includes=$(echo "$includes" | xargs)
          echo "modules=$includes" >> $GITHUB_OUTPUT

      - name: Set SONAR_PROJECT_KEY
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          REPO="${{ github.repository }}"
          REPO_NAME="${REPO##*/}"
          NORMALIZED_BRANCH=$(echo "$BRANCH" | sed 's#[^a-zA-Z0-9._-]#-#g')
          SONAR_KEY="${REPO_NAME}-${NORMALIZED_BRANCH}"
          echo "SONAR_PROJECT_KEY=$SONAR_KEY" >> $GITHUB_ENV
          echo "SONAR_PROJECT_NAME=$SONAR_KEY" >> $GITHUB_ENV

      - name: Build & Analyze only changed modules
        if: steps.detect.outputs.modules != ''
        run: |
          for module in ${{ steps.detect.outputs.modules }}; do
            echo "=============================="
            echo "🔨 Building module: $module"
            echo "=============================="
            mvn -f $module/pom.xml clean install -DskipTests

            echo "=============================="
            echo "📊 Sonar analyzing module: $module"
            echo "=============================="
            mvn -f $module/pom.xml sonar:sonar \
              -Dsonar.projectKey=${SONAR_PROJECT_KEY} \
              -Dsonar.projectName=${SONAR_PROJECT_NAME} \
              -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
              -Dsonar.login=${{ secrets.SONAR_TOKEN }}
          done

      - name: Post or update SonarQube result comment with summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const repo = context.repo.repo;
            const owner = context.repo.owner;
            const branch = context.payload.pull_request.head.ref.replace(/[^a-zA-Z0-9._-]/g, '-');
            const sonarProject = `${repo}-${branch}`;
            const sonarHost = `${{ secrets.SONAR_HOST_URL }}`;
            const sonarToken = `${{ secrets.SONAR_TOKEN }}`;
            const sonarUrl = `${sonarHost}/dashboard?id=${sonarProject}`;
            const tag = '<!-- sonar-comment -->';
            const apiUrl = `${sonarHost}/api/measures/component?component=${sonarProject}&metricKeys=bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density`;

            let summaryText = '';
            try {
              const res = await fetch(apiUrl, {
                headers: {
                  Authorization: `Basic ${Buffer.from(sonarToken + ':').toString('base64')}`
                }
              });
              const data = await res.json();
              const measures = data.component.measures;
              const lookup = Object.fromEntries(measures.map(m => [m.metric, m.value]));
              summaryText = `
                🔍 **SonarQube Analysis Completed**
              - 🐞 Bugs: ${lookup.bugs ?? 'N/A'}
              - 🛡️ Vulnerabilities: ${lookup.vulnerabilities ?? 'N/A'}
              - 🧹 Code Smells: ${lookup.code_smells ?? 'N/A'}
              - 📊 Coverage: ${lookup.coverage ?? 'N/A'}%
              - ♻️ Duplication: ${lookup.duplicated_lines_density ?? 'N/A'}%
                
                🔗 [View analysis results](${sonarUrl})`;
                } catch (e) {
                summaryText = `🔍 **SonarQube Analysis Completed**\n\n🔗 [View results](${sonarUrl})\n⚠️ Summary fetch failed`;
                }
                
                const comments = await github.rest.issues.listComments({
                owner,
                repo,
              issue_number: prNumber
              });
                
                const existing = comments.data.find(c => c.body.includes(tag));
                const body = `${tag}\n${summaryText}`;
                
                if (existing) {
                await github.rest.issues.updateComment({
                owner,
                repo,
              comment_id: existing.id,
                body
              });
              } else {
                await github.rest.issues.createComment({
                owner,
                repo,
              issue_number: prNumber,
                body
              });
              }
